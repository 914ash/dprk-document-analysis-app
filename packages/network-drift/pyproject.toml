[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dprk-drift"
version = "0.1.0"
description = "DPRK Temporal Network Drift Engine - temporal graph analytics pipeline for sanctions-evasion network analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "DPRK Drift Team" }
]
dependencies = [
    "pandas>=2.0",
    "pyarrow>=13.0",
    "networkx>=3.0",
    "scikit-learn>=1.8.0",
    "umap-learn>=0.5",
    "plotly>=5.18",
    "pydantic>=2.0",
    "typer[all]>=0.9",
    "structlog>=23.0",
    "kaleido>=0.2",
    "gensim>=4.3",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "python-louvain>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
    "pandas-stubs>=2.0",
]

[project.scripts]
dprk-drift = "dprk_drift.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dprk_drift"]

[tool.hatch.build.targets.sdist]
include = ["src/"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
markers = [
    "graph_build: tests for graph construction layer",
    "temporal: tests for temporal slicing layer",
    "embedding: tests for node embedding layer",
    "drift: tests for drift scoring layer",
    "viz: tests for visualization layer",
    "structural: tests for architecture/import structure",
    "unit: unit tests for individual components",
    "integration: end-to-end integration tests",
]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"evals/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/", "evals/", "scripts/"]
